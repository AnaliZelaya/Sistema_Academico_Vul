services:
  # ---------------------------------------------------------------------------
  # V1 (INSEGURA) — laboratorio de pentest. Flask dev, debug=True, SQLi real.
  # Objetivo de sqlmap (docs/SQLMAP_ATTACK.md). Puerto 5001 en el host.
  # ---------------------------------------------------------------------------
  v1:
    build:
      context: .
      dockerfile: Dockerfile.v1
    container_name: sistema_v1
    environment:
      PORT: "5001"
    ports:
      - "${V1_PORT:-5001}:5001"
    volumes:
      - uploads_v1:/app/static/uploads
    networks:
      - lab

  # ---------------------------------------------------------------------------
  # V2 (SEGURA) — Gunicorn + SQLite, detras de Nginx TLS.
  # ---------------------------------------------------------------------------
  v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema_v2
    environment:
      SECRET_KEY: ${SECRET_KEY:-cambiar-esta-clave-secreta-en-produccion-2026}
      DATABASE_URL: /app/db/v2_academico.db
      UPLOAD_FOLDER: /app/uploads
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-5242880}
      HTTPS: "off"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - db_v2:/app/db
      - uploads_v2:/app/uploads
    networks:
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: sistema_nginx
    depends_on:
      - v2
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - web

  # ---------------------------------------------------------------------------
  # sqlmap — contenedor de ataque (red interna "lab", alcanza v1:5001).
  # Uso: docker compose run --rm sqlmap -u "http://v1:5001/login" ...
  # La evidencia (.csv/.log) queda en ./docs/sqlmap_evidence (montado en /out).
  # ---------------------------------------------------------------------------
  sqlmap:
    build:
      context: .
      dockerfile: Dockerfile.sqlmap
    container_name: sistema_sqlmap
    profiles: ["attack"]
    depends_on:
      - v1
    working_dir: /out
    volumes:
      - ./docs/sqlmap_evidence:/out
    networks:
      - lab
    entrypoint: ["sqlmap"]

volumes:
  db_v2:
  uploads_v2:
  uploads_v1:

networks:
  web:
  lab:
